  <style>
    :root {
      --primary: #00f2ff;
      --secondary: #7000ff;
      --accent: #adff00;
      --bg: #020617;
    }

    html {
      scroll-behavior: smooth;
      /* Tạo khoảng cách phía trên cho mọi section khi trỏ tới */
      scroll-padding-top: 100px;
    }

    * {
      cursor: none !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      overflow-x: hidden;
    }

    .heading-font {
      font-family: 'Space Grotesk', sans-serif;
    }

    .grid-bg {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 30%, transparent 100%);
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradient-shift 8s linear infinite;
    }

    @keyframes gradient-shift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .glass-card:hover {
      border-color: rgba(0, 242, 255, 0.4);
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 255, 0.1);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    #cursor {
      width: 20px;
      height: 20px;
      background: var(--primary);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: transform 0.1s;
    }

    #cursor-blur {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 242, 255, 0.15) 0%, transparent 70%);
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
      }

      20% {
        transform: translate(-2px, 2px);
      }

      40% {
        transform: translate(-2px, -2px);
      }

      60% {
        transform: translate(2px, 2px);
      }

      80% {
        transform: translate(2px, -2px);
      }

      100% {
        transform: translate(0);
      }
    }

    .hover-glitch:hover {
      animation: glitch 0.3s linear infinite;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--secondary);
      border-radius: 10px;
    }
  </style>

<body class="text-slate-100 selection:bg-cyan-500/30">
  <div id="cursor"></div>
  <div id="cursor-blur"></div>
  <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>
  <div id="root"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const blur = document.getElementById('cursor-blur');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      blur.style.left = e.clientX + 'px';
      blur.style.top = e.clientY + 'px';
    });

    const observerOptions = { threshold: 0.1 };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, observerOptions);

    setTimeout(() => {
      document.querySelectorAll('section, .glass-card').forEach(el => {
        el.classList.add('reveal');
        observer.observe(el);
      });
    }, 1000);
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
